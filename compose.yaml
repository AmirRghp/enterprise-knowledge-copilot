name: enterprise-knowledge-copilot

x-api: &api
  image: enterprise-knowledge-copilot-api:local
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  environment:
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: enterprise-pgvector
    DB_USER: enterprise_knowledge_copilot
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
    WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    API_BIND_HOST: 0.0.0.0
    GENERATION_REQUEST_TIMEOUT: ${GENERATION_REQUEST_TIMEOUT:-30}
    GENERATION_MAX_TOKENS: ${GENERATION_MAX_TOKENS:-4096}
    SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
    LOGIN_RATE_PAIR_LIMIT: ${LOGIN_RATE_PAIR_LIMIT:-5}
    LOGIN_RATE_IP_LIMIT: ${LOGIN_RATE_IP_LIMIT:-30}
    LOGIN_RATE_WINDOW_SECONDS: ${LOGIN_RATE_WINDOW_SECONDS:-60}
    LOGIN_RATE_MAX_KEYS: ${LOGIN_RATE_MAX_KEYS:-10000}
    UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-1048576}
    UPLOAD_MAX_ACTIVE_DOCUMENTS: ${UPLOAD_MAX_ACTIVE_DOCUMENTS:-100}
    UPLOAD_MAX_CURRENT_CHUNKS: ${UPLOAD_MAX_CURRENT_CHUNKS:-2000}
    INGESTION_LEASE_SECONDS: ${INGESTION_LEASE_SECONDS:-120}
    INGESTION_LEASE_RENEW_SECONDS: ${INGESTION_LEASE_RENEW_SECONDS:-30}
    INGESTION_MAX_ATTEMPTS: ${INGESTION_MAX_ATTEMPTS:-3}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  init: true

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      EKC_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-project.sh:ro
      - ./apps/api/sql/provision.sql:/opt/provision.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d enterprise-pgvector"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    <<: *api
    command: ["python", "-m", "app.cli.run_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
