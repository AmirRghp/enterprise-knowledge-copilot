# Alembic configuration for the isolated project database.
#
# There is deliberately no sqlalchemy.url here: DATABASE.md section 11 requires
# the connection to be composed from the typed DB_* settings and the target
# database to be allowlist-checked before any connection opens. env.py does both
# via app.db.url, so no connection string or credential is ever committed.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
